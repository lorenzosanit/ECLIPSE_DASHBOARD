name: Fix eclipse geometry and timezone label

on:
  push:
    branches:
      - dashboard-public-safe
    paths:
      - .github/workflows/fix-geometry-timezone-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch geometry and timezone label
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('eclipse_2027_dashboard_v15.html')
          text=path.read_text(encoding='utf-8')

          old='''  const maxSeparation=2.06;
  const signedSeparation=-maxSeparation + pathProgress*(2*maxSeparation);
  const separation=Math.abs(signedSeparation);'''
          new='''  const totalityEdge=Math.abs(Rm-Rs);
  const totalityDuration=Math.max(c.third-c.second,0.001);
  const apparentSpeed=(2*totalityEdge)/totalityDuration;
  const maxSeparation=totalityEdge+(c.second-c.first)*apparentSpeed;
  const signedSeparation=-maxSeparation + pathProgress*(2*maxSeparation);
  const separation=Math.abs(signedSeparation);'''
          if old not in text:
              raise SystemExit('Expected eclipse geometry block not found')
          text=text.replace(old,new,1)

          old2='''      <select id="timeZoneMode" aria-label="Fuso orario degli orari dell'eclissi" onchange="timeZoneMode=this.value;renderSim()">'''
          new2='''      <select id="timeZoneMode" aria-label="Fuso orario degli orari dell'eclissi" onchange="timeZoneMode=this.value;document.getElementById('timeZoneLabel').textContent=timeZoneLabel();renderSim()">'''
          if old2 not in text:
              raise SystemExit('Timezone selector not found')
          text=text.replace(old2,new2,1)

          old3='''        <option value="local">Locale dispositivo</option>
      </select>
    </label>'''
          new3='''        <option value="local">Locale dispositivo</option>
      </select>
      <span id="timeZoneLabel" class="badge good">Italia / Spagna</span>
    </label>'''
          if old3 not in text:
              raise SystemExit('Timezone option block not found')
          text=text.replace(old3,new3,1)

          path.write_text(text,encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('eclipse_2027_dashboard_v15.html').read_text(encoding='utf-8')
          required=[
            'const totalityEdge=Math.abs(Rm-Rs);',
            'const apparentSpeed=(2*totalityEdge)/totalityDuration;',
            'id="timeZoneLabel"',
            'value="utc"',
            'value="local"',
            'const partialDuration=68/60;'
          ]
          for x in required:
              if x not in text:
                  raise SystemExit('Missing expected patch: '+x)
          print('Patch validation passed')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eclipse_2027_dashboard_v15.html
          git commit -m 'Align eclipse geometry with contact times' || exit 0
          git push
