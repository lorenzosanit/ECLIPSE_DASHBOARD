name: Fix simulator time units

on:
  push:
    branches:
      - dashboard-public-safe
    paths:
      - .github/workflows/fix-simulator-time.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Fix partial-duration units
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('eclipse_2027_dashboard_v15.html')
          text = path.read_text(encoding='utf-8')
          old = '  const partialDuration=68;\n'
          new = '  const partialDuration=68/60;\n'
          if old not in text:
              raise SystemExit('Expected simulator expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eclipse_2027_dashboard_v15.html
          git commit -m 'Fix eclipse simulator time units'
          git push
