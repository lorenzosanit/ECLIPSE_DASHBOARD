name: Dashboard QA and timezone update

on:
  push:
    branches:
      - dashboard-public-safe
    paths:
      - .github/workflows/qa-and-timezone.yml

permissions:
  contents: write

jobs:
  qa-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Patch timezone toggle and simulator clock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('eclipse_2027_dashboard_v15.html')
          text = path.read_text(encoding='utf-8')

          old_clock = '''function clock(mins){
            let h=Math.floor(mins), m=Math.floor((mins-h)*60), s=Math.floor((((mins-h)*60)-m)*60);
            if(s>=60){s=0;m++} if(m>=60){m=0;h++}
            return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
          }'''

          new_clock = '''let timeZoneMode="madrid";
          function clock(mins){
            const totalSeconds=Math.round(mins*60);
            const baseHours=Math.floor(totalSeconds/3600);
            const baseMinutes=Math.floor((totalSeconds%3600)/60);
            const baseSeconds=totalSeconds%60;
            const baseDate=Date.UTC(2027,7,2,baseHours,baseMinutes,baseSeconds);

            const partsFor=(date,timeZone)=>{
              const parts=new Intl.DateTimeFormat("en-CA",{
                timeZone,
                year:"numeric",month:"2-digit",day:"2-digit",
                hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
              }).formatToParts(date);
              const out={};
              for(const p of parts) out[p.type]=p.value;
              return out;
            };

            const madridParts=partsFor(new Date(baseDate),"Europe/Madrid");
            const targetWall=Date.UTC(2027,7,2,baseHours,baseMinutes,baseSeconds);
            const madridWall=Date.UTC(
              Number(madridParts.year),Number(madridParts.month)-1,Number(madridParts.day),
              Number(madridParts.hour),Number(madridParts.minute),Number(madridParts.second)
            );
            const instant=new Date(baseDate+(targetWall-madridWall));

            let zone="Europe/Madrid";
            if(timeZoneMode==="utc") zone="UTC";
            if(timeZoneMode==="local") zone=undefined;

            const shown=partsFor(instant,zone);
            return String(shown.hour).padStart(2,"0")+":"+
              String(shown.minute).padStart(2,"0")+":"+
              String(shown.second).padStart(2,"0");
          }

          function timeZoneLabel(){
            if(timeZoneMode==="utc") return "UTC";
            if(timeZoneMode==="local") return "Locale dispositivo";
            return "Italia / Spagna";
          }'''

          if old_clock not in text:
              raise SystemExit('Expected clock() function not found; refusing automatic edit')
          text=text.replace(old_clock,new_clock,1)

          marker='''<select id="simPoint" onchange="setSelectedLocation(this.value,'simulator')"></select>'''
          toggle='''<label class="time-zone-control" style="display:flex;align-items:center;gap:8px">\n      <span class="muted">Orari:</span>\n      <select id="timeZoneMode" aria-label="Fuso orario degli orari dell'eclissi" onchange="timeZoneMode=this.value;renderSim()">\n        <option value="madrid">Italia / Spagna</option>\n        <option value="utc">UTC</option>\n        <option value="local">Locale dispositivo</option>\n      </select>\n    </label>\n    '''+marker
          if marker not in text:
              raise SystemExit('Simulator selector marker not found; refusing automatic edit')
          text=text.replace(marker,toggle,1)

          if 'const partialDuration=68;' in text:
              text=text.replace('const partialDuration=68;','const partialDuration=68/60;',1)
          elif 'const partialDuration=68/60;' not in text:
              raise SystemExit('Expected partialDuration expression not found')

          path.write_text(text,encoding='utf-8')
          PY

      - name: Static and JavaScript QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('eclipse_2027_dashboard_v15.html').read_text(encoding='utf-8')

          required_ids=[
            'pointSelect','simPoint','timeZoneMode','map','eclipseCanvas','simSlider',
            'simTime','simPhase','simCoverage','simAlt','simAz','c1','c2','cm','c3','c4'
          ]
          for item in required_ids:
              if not re.search(r'id=["\']'+re.escape(item)+r'["\']',html):
                  raise SystemExit(f'Missing required element: {item}')

          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          duplicates=sorted({x for x in ids if ids.count(x)>1})
          if duplicates:
              raise SystemExit('Duplicate HTML ids: '+', '.join(duplicates))

          inline_scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/dashboard-inline.js').write_text('\n'.join(inline_scripts),encoding='utf-8')

          handlers=re.findall(r'(?:onclick|onchange|oninput)=["\']\s*([A-Za-z_$][\w$]*)\s*\(',html)
          functions=set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', '\n'.join(inline_scripts)))
          missing=sorted(set(handlers)-functions-{'renderSim'})
          if missing:
              raise SystemExit('Handler functions not defined: '+', '.join(missing))

          sensitive=[]
          for pattern,name in [
            (r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----','private key'),
            (r'(?i)bearer\s+[A-Za-z0-9._-]{20,}','bearer token'),
            (r'(?i)(?:api[_-]?key|secret[_-]?key|access[_-]?token)\s*[:=]\s*["\'][^"\']{12,}["\']','credential-like value'),
            (r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}','email address'),
          ]:
              if re.search(pattern,html): sensitive.append(name)
          if sensitive:
              raise SystemExit('Potential sensitive content found: '+', '.join(sensitive))

          for expected in ['const partialDuration=68/60;','let timeZoneMode="madrid";','value="utc"','value="local"']:
              if expected not in html:
                  raise SystemExit('Missing expected implementation: '+expected)

          print('Static QA passed')
          print(f'HTML bytes: {len(html.encode())}')
          print(f'Inline script blocks: {len(inline_scripts)}')
          print(f'HTML ids: {len(ids)}')
          print('Sensitive-content scan: passed')
          PY
          node --check /tmp/dashboard-inline.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eclipse_2027_dashboard_v15.html
          if git diff --cached --quiet; then
            echo 'No dashboard changes to commit'
          else
            git commit -m 'Add timezone toggle and run dashboard QA'
            git push
          fi
